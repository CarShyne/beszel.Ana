# Portainer — PULL ONLY (no build). Use after publishing images to Docker Hub.
#
# Portainer → Stacks → Add stack → Repository
#   URL: https://github.com/CarShyne/beszel.Ana
#   Compose path: docker-compose.portainer.yml
#
# Publish images first (on Mac):
#   ./scripts/publish-anarchy-pulse-arm64.sh
#
# Do NOT use Web editor with a pasted compose — that has no source tree to build.
# If images are not on Hub yet, SSH to the Pi and run:
#   bash scripts/opm-install.sh

services:
  anarchy-pulse:
    image: jt7777/anarchy-pulse:latest
    pull_policy: always
    container_name: anarchy-pulse
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:8090
      # Optional first admin (only applied on a fresh data volume):
      # ANARCHY_PULSE_HUB_USER_EMAIL: admin@yourdomain.com
      # ANARCHY_PULSE_HUB_USER_PASSWORD: your-secure-password
    ports:
      - "8090:8090"
    volumes:
      - ./anarchy_pulse_data:/anarchy_pulse_data
      - ./anarchy_pulse_socket:/anarchy_pulse_socket

  anarchy-pulse-agent:
    image: jt7777/anarchy-pulse-agent:latest
    pull_policy: always
    container_name: anarchy-pulse-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./anarchy_pulse_agent_data:/var/lib/anarchy-pulse-agent
      - ./anarchy_pulse_socket:/anarchy_pulse_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /anarchy_pulse_socket/anarchy-pulse.sock
      HUB_URL: http://localhost:8090
      TOKEN: ${TOKEN:-}
      KEY: ${KEY:-}
