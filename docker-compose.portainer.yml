# Portainer on Raspberry Pi / NAS — build from repo (no Docker Hub pull required)
#
# Portainer → Stacks → Add stack → Repository
#   URL: https://github.com/CarShyne/beszel.Ana
#   Compose path: docker-compose.portainer.yml
#
# First deploy builds on the host (10–20 min on Pi). After publishing to Hub,
# switch image: lines to jt7777/anarchy-pulse:latest and remove build: blocks.

services:
  anarchy-pulse:
    build:
      context: .
      dockerfile: internal/dockerfile_hub
    image: jt7777/anarchy-pulse:latest
    container_name: anarchy-pulse
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:8090
    ports:
      - "8090:8090"
    volumes:
      - ./anarchy_pulse_data:/anarchy_pulse_data
      - ./anarchy_pulse_socket:/anarchy_pulse_socket

  anarchy-pulse-agent:
    build:
      context: .
      dockerfile: internal/dockerfile_agent_alpine
    image: jt7777/anarchy-pulse-agent:latest
    container_name: anarchy-pulse-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./anarchy_pulse_agent_data:/var/lib/anarchy-pulse-agent
      - ./anarchy_pulse_socket:/anarchy_pulse_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /anarchy_pulse_socket/anarchy-pulse.sock
      HUB_URL: http://localhost:8090
      TOKEN: ${TOKEN:-}
      KEY: ${KEY:-}
